<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Even Orca 설정</title>
  <link rel="stylesheet" href="/assets/settings.css">
  <script src="/assets/settings.js" type="module"></script>
</head>
<body>
  <main>
    <header class="top"><h1>Even Orca</h1><p id="connection" role="status">Orca 연결 확인 중</p></header>
    <details id="pairing" hidden>
      <summary>G2 연결 QR</summary>
      <p class="muted">Even Realities 앱의 Terminal에서 스캔하세요.</p>
      <img alt="Even Terminal 연결 QR 코드" width="220" height="220">
    </details>
    <section aria-labelledby="configuration">
      <form id="settings">
        <div class="title-row"><h2 id="configuration">문장 보정</h2><button type="submit">설정 저장</button></div>
        <div class="fields">
          <label>OpenAI 모델<input id="model" autocomplete="off" spellcheck="false" required list="models"></label>
          <datalist id="models"><option value="gpt-6-luna"><option value="gpt-6.2-sol"></datalist>
          <label>Reasoning effort<select id="effort"><option>none</option><option>minimal</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select></label>
        </div>
        <div class="title-row dictionary"><h3>내 사전</h3><button class="secondary" id="add" type="button">단어 추가</button></div>
        <p class="muted">정확한 표기를 등록하세요. 자주 생기는 오인식은 함께 적어 두면 우선 교정됩니다.</p>
        <div id="terms"></div>
        <p id="feedback" role="status"></p>
      </form>
    </section>
    <section aria-labelledby="submissions">
      <div class="title-row"><h2 id="submissions">최근 음성 입력</h2><button class="secondary" id="refresh" type="button">새로고침</button></div>
      <p id="empty" class="muted">아직 받은 프롬프트가 없습니다.</p>
      <ol id="activity"></ol>
    </section>
  </main>
  <template id="term-row"><div class="term-row">
    <label>오인식 표기 <span class="muted">선택</span><input name="heard" maxlength="120" placeholder="워크 트리" autocomplete="off"></label>
    <label>표준 표기<input name="preferred" maxlength="120" placeholder="worktree" autocomplete="off" required></label>
    <button type="button" class="secondary remove" aria-label="사전 항목 삭제">삭제</button>
  </div></template>
</body>
</html>
